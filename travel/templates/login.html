{% extends 'base.html' %}

{% block content %}
<section class="auth section">
    <div class="container">
        <div class="auth__wrapper">
            <h1 class="auth__title">Вход в аккаунт</h1>
            <p class="auth__subtitle">Введите email и пароль, чтобы продолжить</p>

            <form action="{% url 'login' %}" method="POST" class="auth__form" id="loginForm" novalidate>
                {% csrf_token %}

                {% if form.errors %}
                <p style="color: red; font-size: 14px; margin-bottom: 10px;">Неверный email или пароль.</p>
                {% endif %}

                <div class="form__group">
                    <label class="form__label">Email *</label>
                    {{ form.username }}
                </div>

                <div class="form__group">
                    <label class="form__label">Пароль *</label>
                    {{ form.password }}
                </div>

                <button type="submit" class="button button_theme_primary auth__submit">Войти</button>

                <p class="auth__footer-text">
                    Нет аккаунта? <a href="{% url 'register' %}" class="auth__link">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </div>
</section>
{% endblock %}
